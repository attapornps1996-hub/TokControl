<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>ตั้งรหัสผ่านใหม่ — TokControl</title>
    <style>
        body { margin:0; background:#090614; color:#fff; font-family:'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; box-sizing:border-box; }
        .box { width:min(380px,100%); background:rgba(12,8,24,.96); border:1px solid rgba(188,19,254,.25); border-radius:16px; padding:28px; }
        h2 { color:#bc13fe; margin:0 0 8px; }
        p { color:#aaa; font-size:.9rem; line-height:1.5; }
        input { width:100%; padding:12px; margin:12px 0; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.4); color:#fff; box-sizing:border-box; }
        button { width:100%; padding:12px; border:none; border-radius:10px; background:#bc13fe; color:#fff; font-weight:700; cursor:pointer; }
        .msg { margin-top:12px; font-size:.85rem; }
        .err { color:#ff4757; } .ok { color:#2ecc71; }
    </style>
</head>
<body>
    <div class="box">
        <img src="assets/tokcontrol-logo.png" alt="TokControl" style="width:88px;display:block;margin:0 auto 16px">
        <h2>ตั้งรหัสผ่านใหม่</h2>
        <p>รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร</p>
        <input type="password" id="newPass" placeholder="รหัสผ่านใหม่" autocomplete="new-password">
        <input type="password" id="newPass2" placeholder="ยืนยันรหัสผ่าน" autocomplete="new-password">
        <button type="button" id="submitBtn">บันทึกรหัสผ่าน</button>
        <div class="msg" id="msg"></div>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('token') || '';
        const msg = document.getElementById('msg');
        const apiBase = location.origin.includes('127.0.0.1') || location.origin.includes('localhost')
            ? location.origin
            : 'https://pandy-backend-302414976454.asia-southeast1.run.app';

        document.getElementById('submitBtn').onclick = async () => {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('newPass2').value;
            msg.className = 'msg';
            if (!token) { msg.textContent = 'ลิงก์ไม่ถูกต้อง'; msg.classList.add('err'); return; }
            if (p1.length < 8) { msg.textContent = 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร'; msg.classList.add('err'); return; }
            if (p1 !== p2) { msg.textContent = 'รหัสผ่านไม่ตรงกัน'; msg.classList.add('err'); return; }
            try {
                const res = await fetch(apiBase + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: p1 })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'ตั้งรหัสผ่านไม่สำเร็จ');
                msg.textContent = data.message || 'สำเร็จ — กลับไปเข้าสู่ระบบใน TokControl';
                msg.classList.add('ok');
            } catch (e) {
                msg.textContent = e.message || 'เกิดข้อผิดพลาด';
                msg.classList.add('err');
            }
        };
    </script>
</body>
</html>
