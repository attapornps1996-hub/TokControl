<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>โดเนท — TokDonate</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/tokcontrol-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/tokcontrol-icon.png">
  <link rel="apple-touch-icon" href="/assets/tokcontrol-icon.png">
  <link rel="shortcut icon" href="/assets/tokcontrol-icon.png">
  <meta name="theme-color" content="#07060b">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#07060b',
            panel: '#12101a',
            card: '#16131f',
            panda: '#ef4444',
            violet: '#a855f7',
            emerald: '#10b981'
          },
          fontFamily: {
            sans: ['"IBM Plex Sans Thai"', 'Kanit', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', '"IBM Plex Sans Thai"', 'sans-serif']
          },
          boxShadow: {
            glow: '0 20px 50px rgba(168,85,247,0.22)',
            emerald: '0 0 28px rgba(16,185,129,0.35)'
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(168,85,247,.28), transparent 55%),
        radial-gradient(700px 420px at 95% 5%, rgba(16,185,129,.18), transparent 50%),
        radial-gradient(500px 360px at 50% 80%, rgba(239,68,68,.12), transparent 55%),
        #07060b;
    }
    .avatar-ring {
      box-shadow: 0 0 0 3px rgba(239,68,68,.45), 0 12px 30px rgba(168,85,247,.35);
    }
    .chip-active { background: linear-gradient(135deg,#a855f7,#10b981); color:#fff; border-color:transparent; }
  </style>
</head>
<body class="font-sans text-violet-50 min-h-screen">
  <main class="relative z-10 mx-auto w-full max-w-5xl px-4 py-8 sm:py-12">
    <header class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-center">
      <img id="streamerAvatar" class="avatar-ring h-24 w-24 rounded-3xl object-cover bg-panel" src="/assets/tokcontrol-icon.png" alt="" />
      <div class="flex-1">
        <p class="font-display text-xs font-bold tracking-[0.14em] uppercase text-emerald-400">TokDonate</p>
        <div class="mt-1 flex flex-wrap items-center gap-3">
          <h1 id="streamerName" class="text-3xl font-bold tracking-tight sm:text-4xl">กำลังโหลด…</h1>
          <span id="onlineBadge" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/15 px-3 py-1 text-xs font-semibold text-emerald-300 ring-1 ring-emerald-400/30">
            <span class="h-2 w-2 animate-pulse rounded-full bg-emerald-400"></span> Online
          </span>
        </div>
        <p id="streamerBio" class="mt-2 max-w-2xl text-sm text-violet-200/70 sm:text-base">โอน PromptPay แล้วอัปโหลดสลิป — ระบบตรวจอัตโนมัติ</p>
        <div id="socialRow" class="mt-4 flex flex-wrap gap-2"></div>
      </div>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1.15fr_0.85fr]">
      <form id="donateForm" class="rounded-3xl border border-violet-500/20 bg-card/90 p-5 shadow-glow backdrop-blur sm:p-6" autocomplete="off">
        <label class="mb-4 block">
          <span class="mb-1.5 block text-sm text-violet-200/70">ชื่อผู้โดเนท</span>
          <input id="donorName" type="text" maxlength="40" placeholder="ผู้ไม่ประสงค์ออกนาม"
            class="w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 outline-none focus:border-violet-400/60" />
        </label>

        <div class="mb-4">
          <span class="mb-1.5 block text-sm text-violet-200/70">จำนวนเงินด่วน (บาท)</span>
          <div id="amountChips" class="mb-3 flex flex-wrap gap-2">
            <button type="button" data-amt="20" class="amt-chip rounded-xl border border-white/10 bg-black/25 px-4 py-2 text-sm font-semibold hover:border-violet-400/50">20</button>
            <button type="button" data-amt="50" class="amt-chip rounded-xl border border-white/10 bg-black/25 px-4 py-2 text-sm font-semibold hover:border-violet-400/50">50</button>
            <button type="button" data-amt="100" class="amt-chip rounded-xl border border-white/10 bg-black/25 px-4 py-2 text-sm font-semibold hover:border-violet-400/50">100</button>
            <button type="button" data-amt="500" class="amt-chip rounded-xl border border-white/10 bg-black/25 px-4 py-2 text-sm font-semibold hover:border-violet-400/50">500</button>
          </div>
          <input id="amount" type="number" min="1" step="1" required placeholder="50"
            class="w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 outline-none focus:border-violet-400/60" />
        </div>

        <label class="mb-4 block">
          <span class="mb-1.5 block text-sm text-violet-200/70">ข้อความฝากถึงสตรีมเมอร์</span>
          <textarea id="message" rows="3" maxlength="500" placeholder="ส่งกำลังใจถึงสตรีมเมอร์…"
            class="w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 outline-none focus:border-violet-400/60"></textarea>
        </label>

        <label class="mb-4 block">
          <span class="mb-1.5 block text-sm text-violet-200/70">อัปโหลดสลิปโอนเงิน</span>
          <input id="slipFile" type="file" accept="image/*" required
            class="w-full rounded-2xl border border-dashed border-white/15 bg-black/20 px-4 py-3 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-violet-600 file:px-3 file:py-1.5 file:text-white" />
          <div id="slipPreview" class="mt-3 hidden overflow-hidden rounded-2xl border border-white/10"></div>
        </label>

        <p id="formError" class="mb-3 hidden text-sm text-red-300"></p>
        <p id="formOk" class="mb-3 hidden text-sm text-emerald-300"></p>

        <div class="flex flex-col gap-2 sm:flex-row">
          <button type="button" id="openQrBtn"
            class="flex-1 rounded-2xl border border-emerald-400/30 bg-emerald-500/10 px-4 py-3 font-semibold text-emerald-200 hover:bg-emerald-500/20">
            เปิด QR PromptPay
          </button>
          <button type="submit" id="submitBtn"
            class="flex-1 rounded-2xl bg-gradient-to-r from-violet-500 to-emerald-500 px-4 py-3 font-bold text-white shadow-emerald">
            ยืนยันการโดเนท
          </button>
        </div>
      </form>

      <aside class="rounded-3xl border border-violet-500/20 bg-card/90 p-5 shadow-glow backdrop-blur sm:p-6">
        <h2 class="font-display text-lg font-bold">สแกน PromptPay</h2>
        <p id="qrHint" class="mt-1 text-sm text-violet-200/65">เลือกยอดเงินแล้วกดเปิด QR</p>
        <div class="mt-4 grid min-h-[260px] place-items-center rounded-2xl bg-white p-3">
          <img id="qrImage" alt="PromptPay QR" class="hidden w-full max-w-[240px]" />
          <div id="qrEmpty" class="px-4 text-center text-sm text-slate-500">รอจำนวนเงิน…</div>
        </div>
        <dl class="mt-4 space-y-2 text-sm">
          <div class="flex justify-between gap-3"><dt class="text-violet-200/55">ชื่อบัญชี</dt><dd id="accountName" class="font-semibold">—</dd></div>
          <div class="flex justify-between gap-3"><dt class="text-violet-200/55">ธนาคาร</dt><dd id="bankCode" class="font-semibold">—</dd></div>
          <div class="flex justify-between gap-3"><dt class="text-violet-200/55">ยอดขั้นต่ำ</dt><dd id="minDonation" class="font-semibold">—</dd></div>
        </dl>
        <p class="mt-4 text-xs text-violet-200/45">หลังโอนสำเร็จ อัปโหลดสลิปด้านซ้าย — ระบบจะแจ้งเตือนบนสตรีมอัตโนมัติ</p>
      </aside>
    </section>
  </main>

  <!-- QR Modal -->
  <div id="qrModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
    <div class="w-full max-w-md rounded-3xl border border-violet-400/30 bg-panel p-6 shadow-glow">
      <div class="mb-4 flex items-start justify-between gap-3">
        <div>
          <h3 class="text-xl font-bold">สแกนเพื่อโดเนท</h3>
          <p id="modalHint" class="mt-1 text-sm text-violet-200/65">PromptPay</p>
        </div>
        <button type="button" id="closeQrBtn" class="rounded-xl bg-white/5 px-3 py-1.5 text-sm hover:bg-white/10">ปิด</button>
      </div>
      <div class="grid place-items-center rounded-2xl bg-white p-4">
        <img id="modalQr" alt="QR" class="w-full max-w-[280px]" />
      </div>
      <button type="button" id="ttsDemoBtn" class="mt-4 w-full rounded-2xl border border-panda/40 bg-panda/15 px-4 py-3 font-semibold text-red-200 hover:bg-panda/25">
        ลองเสียง TTS (จำลอง)
      </button>
    </div>
  </div>

  <script>
(function () {
  function resolveDonateSlug() {
    const host = String(location.hostname || '').toLowerCase();
    const parts = host.split('.');
    if (parts.length >= 3 || (parts.length === 2 && parts[1] === 'localhost')) {
      const maybe = parts[0];
      if (maybe && maybe !== 'www' && maybe !== 'app' && /^[a-z0-9-]+$/.test(maybe)) return maybe;
    }
    const segs = location.pathname.split('/').filter(Boolean);
    if (segs[0] === 'donate' && segs[1]) return decodeURIComponent(segs[1]);
    return decodeURIComponent(segs.pop() || '');
  }

  const slug = resolveDonateSlug();
  const els = {
    name: document.getElementById('streamerName'),
    avatar: document.getElementById('streamerAvatar'),
    bio: document.getElementById('streamerBio'),
    online: document.getElementById('onlineBadge'),
    social: document.getElementById('socialRow'),
    amount: document.getElementById('amount'),
    donorName: document.getElementById('donorName'),
    message: document.getElementById('message'),
    slipFile: document.getElementById('slipFile'),
    slipPreview: document.getElementById('slipPreview'),
    form: document.getElementById('donateForm'),
    submitBtn: document.getElementById('submitBtn'),
    err: document.getElementById('formError'),
    ok: document.getElementById('formOk'),
    qrImage: document.getElementById('qrImage'),
    qrEmpty: document.getElementById('qrEmpty'),
    qrHint: document.getElementById('qrHint'),
    accountName: document.getElementById('accountName'),
    bankCode: document.getElementById('bankCode'),
    minDonation: document.getElementById('minDonation'),
    modal: document.getElementById('qrModal'),
    modalQr: document.getElementById('modalQr'),
    modalHint: document.getElementById('modalHint')
  };

  let minDonation = 10;
  let minTts = 20;
  let slipDataUrl = '';
  let qrTimer = null;
  let lastQr = '';

  function showError(msg) {
    els.err.classList.toggle('hidden', !msg);
    els.err.textContent = msg || '';
    if (msg) els.ok.classList.add('hidden');
  }
  function showOk(msg) {
    els.ok.classList.toggle('hidden', !msg);
    els.ok.textContent = msg || '';
    if (msg) els.err.classList.add('hidden');
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'th-TH';
      u.rate = 1.05;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
      reader.readAsDataURL(file);
    });
  }

  function renderSocial(social) {
    const map = [
      { key: 'youtube', label: 'YouTube', color: 'hover:border-red-400/50' },
      { key: 'tiktok', label: 'TikTok', color: 'hover:border-cyan-400/50' },
      { key: 'facebook', label: 'Facebook', color: 'hover:border-blue-400/50' },
      { key: 'discord', label: 'Discord', color: 'hover:border-indigo-400/50' }
    ];
    els.social.innerHTML = map
      .filter((m) => social && social[m.key])
      .map((m) =>
        '<a href="' + social[m.key] + '" target="_blank" rel="noopener" class="rounded-xl border border-white/10 bg-black/25 px-3 py-1.5 text-xs font-semibold ' + m.color + '">' + m.label + '</a>'
      )
      .join('');
  }

  function setChipActive(val) {
    document.querySelectorAll('.amt-chip').forEach((btn) => {
      btn.classList.toggle('chip-active', Number(btn.dataset.amt) === Number(val));
    });
  }

  async function loadStreamer() {
    const res = await fetch('/api/donate/streamer/' + encodeURIComponent(slug));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      els.name.textContent = 'ไม่พบหน้าโดเนท';
      els.bio.textContent = data.error || 'ลิงก์ไม่ถูกต้อง';
      els.form.querySelectorAll('input,textarea,button').forEach((el) => { el.disabled = true; });
      return;
    }
    fetch('/api/donate/track-view/' + encodeURIComponent(slug), { method: 'POST' }).catch(() => {});
    const s = data.streamer || {};
    els.name.textContent = s.displayName || s.username || 'Streamer';
    document.title = 'โดเนทถึง ' + els.name.textContent;
    if (s.avatarUrl) els.avatar.src = s.avatarUrl;
    if (s.bio) els.bio.textContent = s.bio;
    if (s.online === false) {
      els.online.innerHTML = '<span class="h-2 w-2 rounded-full bg-slate-400"></span> Offline';
      els.online.className = 'inline-flex items-center gap-1.5 rounded-full bg-white/5 px-3 py-1 text-xs font-semibold text-slate-300 ring-1 ring-white/10';
    }
    renderSocial(s.social || {});
    minDonation = Number(data.minDonation) || 10;
    minTts = Number(data.minTtsAmount) || 20;
    els.amount.min = String(minDonation);
    els.amount.placeholder = String(minDonation);
    els.minDonation.textContent = '฿' + minDonation;
    els.accountName.textContent = data.accountName || '—';
    els.bankCode.textContent = data.bankCode || '—';
    if (!data.ready) {
      showError('สตรีมเมอร์ยังตั้งค่าบัญชีรับเงินไม่ครบ');
      els.submitBtn.disabled = true;
    }
  }

  async function refreshQr() {
    const amount = Number(els.amount.value);
    if (!(amount >= minDonation)) {
      els.qrImage.classList.add('hidden');
      els.qrEmpty.classList.remove('hidden');
      els.qrEmpty.textContent = amount ? 'ยอดต่ำกว่าขั้นต่ำ' : 'รอจำนวนเงิน…';
      lastQr = '';
      return;
    }
    els.qrHint.textContent = 'กำลังสร้าง QR…';
    try {
      const res = await fetch('/api/donate/generate-qr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ streamer_slug: slug, amount })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'สร้าง QR ไม่สำเร็จ');
      lastQr = data.qrDataUrl;
      els.qrImage.src = lastQr;
      els.qrImage.classList.remove('hidden');
      els.qrEmpty.classList.add('hidden');
      els.qrHint.textContent = 'สแกนด้วยแอปธนาคาร ยอด ฿' + amount;
      els.modalQr.src = lastQr;
      els.modalHint.textContent = 'PromptPay · ฿' + amount;
      if (data.accountName) els.accountName.textContent = data.accountName;
      if (data.bankCode) els.bankCode.textContent = data.bankCode;
    } catch (e) {
      els.qrImage.classList.add('hidden');
      els.qrEmpty.classList.remove('hidden');
      els.qrEmpty.textContent = e.message || 'สร้าง QR ไม่ได้';
      lastQr = '';
    }
  }

  document.getElementById('amountChips').addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-amt]');
    if (!btn) return;
    els.amount.value = btn.dataset.amt;
    setChipActive(btn.dataset.amt);
    refreshQr();
  });

  els.amount.addEventListener('input', () => {
    setChipActive(els.amount.value);
    clearTimeout(qrTimer);
    qrTimer = setTimeout(refreshQr, 350);
  });

  document.getElementById('openQrBtn').addEventListener('click', async () => {
    await refreshQr();
    if (!lastQr) return showError(els.qrEmpty.textContent || 'สร้าง QR ไม่ได้');
    els.modal.classList.remove('hidden');
    els.modal.classList.add('flex');
  });
  document.getElementById('closeQrBtn').addEventListener('click', () => {
    els.modal.classList.add('hidden');
    els.modal.classList.remove('flex');
  });
  document.getElementById('ttsDemoBtn').addEventListener('click', () => {
    const name = els.donorName.value.trim() || 'ผู้สนับสนุน';
    const amt = els.amount.value || minDonation;
    speak(name + ' โดเนท ' + amt + ' บาท' + (els.message.value ? ' ข้อความว่า ' + els.message.value : ''));
  });

  els.slipFile.addEventListener('change', async () => {
    const file = els.slipFile.files && els.slipFile.files[0];
    slipDataUrl = '';
    els.slipPreview.classList.add('hidden');
    els.slipPreview.innerHTML = '';
    if (!file) return;
    try {
      slipDataUrl = await fileToDataUrl(file);
      const img = document.createElement('img');
      img.src = slipDataUrl;
      img.alt = 'ตัวอย่างสลิป';
      img.className = 'max-h-44 w-full object-contain';
      els.slipPreview.appendChild(img);
      els.slipPreview.classList.remove('hidden');
    } catch (e) {
      showError(e.message);
    }
  });

  els.form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    showError('');
    showOk('');
    const amount = Number(els.amount.value);
    if (!(amount >= minDonation)) return showError('ยอดขั้นต่ำ ฿' + minDonation);
    if (!slipDataUrl) return showError('กรุณาอัปโหลดสลิป');
    els.submitBtn.disabled = true;
    els.submitBtn.textContent = 'กำลังตรวจสลิป…';
    try {
      const res = await fetch('/api/donate/verify-slip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          streamer_slug: slug,
          amount,
          donor_name: els.donorName.value.trim() || 'ผู้ไม่ประสงค์ออกนาม',
          message: els.message.value.trim(),
          slipDataUrl
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data.error || 'โดเนทไม่สำเร็จ');
      showOk('โดเนทสำเร็จ ขอบคุณครับ/ค่ะ!');
      if (amount >= minTts) {
        speak((els.donorName.value.trim() || 'ผู้ไม่ประสงค์ออกนาม') + ' โดเนท ' + amount + ' บาท' + (els.message.value ? ' ข้อความว่า ' + els.message.value : ''));
      }
      els.message.value = '';
      els.slipFile.value = '';
      slipDataUrl = '';
      els.slipPreview.classList.add('hidden');
      els.slipPreview.innerHTML = '';
    } catch (e) {
      showError(e.message || 'เกิดข้อผิดพลาด');
    } finally {
      els.submitBtn.disabled = false;
      els.submitBtn.textContent = 'ยืนยันการโดเนท';
    }
  });

  loadStreamer().catch((e) => {
    els.name.textContent = 'โหลดไม่สำเร็จ';
    showError(e.message);
  });
})();
  </script>
</body>
</html>
